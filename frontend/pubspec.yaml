name: news_app_clean_architecture
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  #icon
  ionicons: ^0.1.2

  #state management
  flutter_bloc: ^9.0.0

  #comparing dart objects
  equatable: ^2.0.5

  #service locator
  get_it: ^7.6.0

  #dateFormat
  intl: ^0.19.0

  #Database
  floor: ^1.4.2
  sqflite: ^2.3.0

  #make request to api
  # Note: retrofit 3.x is the last version requiring dio ^4.x.
  # retrofit_generator/floor_generator are excluded from dev_deps because
  # their analyzer pins conflict with bloc_test. Generated .g.dart files
  # are pre-committed. Codegen tools can be restored when needed.
  retrofit: ^3.0.1
  dio: ^4.0.0

  # Firebase
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_auth: ^5.0.0

  #Hooks
  flutter_hooks: ^0.20.0

  #cached image
  cached_network_image: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter


flutter:

  uses-material-design: true


  fonts:
    - family: Muli
      fonts:
        - asset: assets/fonts/muli/Muli.ttf
        - asset: assets/fonts/muli/Muli-Bold.ttf
          weight: 700
        - asset: assets/fonts/muli/Muli-Light.ttf
          weight: 300
